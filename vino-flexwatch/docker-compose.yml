version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: vino-flexwatch_web_1
      APP_PORT: 80

  # só um redirecionamento: quem abrir o app vai para o painel do FlexWatch na porta 8771 do mesmo endereço
  # (funciona com umbrel.local e com o IP). Não guarda nada.
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    command: >-
      sh -c "printf 'server { listen 80; location / { return 302 http://$$host:8771$$request_uri; } }'
      > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
